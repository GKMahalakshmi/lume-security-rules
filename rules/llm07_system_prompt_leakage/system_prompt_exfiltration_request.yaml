id: LUME-LLM07-001
name: System Prompt Exfiltration Request
description: Detects user prompt attempts to coerce the model into leaking or repeating
  its verbatim initialization prompt, hidden instructions, or system guardrails.
category: 'LLM07: System Prompt Leakage'
severity: HIGH
confidence: MEDIUM
validation_status: experimental / unvalidated
target: prompt
detection_logic:
  match_type: composite
  patterns:
  - (?i)\b(?:repeat|print|output|display|show|reveal|dump)\s+(?:all\s+|the\s+)?(?:exact|verbatim|full|original|initial|hidden)?\s*(?:system\s+)?(?:prompt|instructions|directive|pre-prompt)\b
  - (?i)\b(?:what\s+(?:were|are)\s+your\s+(?:exact\s+)?(?:initial|original|system)\s+(?:instructions|prompts))\b
  - (?i)\boutput\s+everything\s+(?:above|before)\s+this\s+line\b
  negative_patterns:
  - (?i)\b(?:what\s+is\s+a\s+system\s+prompt|explain\s+system\s+prompt|purpose\s+of\s+system\s+prompt)\b
  - (?i)\b(?:concept|tutorial|difference\s+between|architecture)\b
known_limitations:
- Subtle semantic extraction prompts (e.g. 'what tone were you asked to maintain during
  initialization?') may not match literal patterns.
- Requires semantic pairing with response verification for high-assurance alerting.
- 'Marked experimental: Requires empirical tuning against user question distributions.'
test_fixtures:
  positive:
  - tests/fixtures/llm07_system_prompt_leakage/positive/exfiltration_request_01.json
  negative:
  - tests/fixtures/llm07_system_prompt_leakage/negative/benign_discussion_01.json
